        function parseQuestions(text) {
            const lines = text.split('\n');
            let currentCategory = "綜合測驗";
            let currentQText = "";
            let questions = [];

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                if (/^[一二三四五六七八九十]、/.test(line) && !line.includes('題庫')) {
                    currentCategory = line;
                    currentQText = "";
                    continue;
                }
                if (line.includes('----') || line.startsWith('姓名：') || line.includes('核心考點') || line.includes('考試題庫')) continue;

                let ansIndex = line.indexOf("答案：");
                if (ansIndex !== -1) {
                    let qPart = line.substring(0, ansIndex).trim();
                    let aPart = line.substring(ansIndex + 3).trim();

                    if (qPart) {
                        currentQText += (currentQText ? "\n" : "") + qPart;
                    }

                    let parts = currentQText.split(/(?=\([A-E]\)\s*)/);
                    let mainQ = parts[0].trim();
                    let opts = parts.slice(1).map(p => p.trim());
                    
                    let ansMatch = aPart.match(/\(([A-E])\)/);
                    let correctLetter = ansMatch ? ansMatch[1] : null;

                    questions.push({
                        id: questions.length + 1,
                        category: currentCategory,
                        question: mainQ,
                        options: opts,
                        correctLetter: correctLetter,
                        rawAnswer: aPart,
                        isShortAnswer: opts.length === 0
                    });

                    currentQText = ""; 
                } else {
                    currentQText += (currentQText ? "\n" : "") + line;
                }
            }
            return questions;
        }

        function App() {
            const allQuestions = useMemo(() => parseQuestions(rawData), []);
            const [categories, setCategories] = useState([]);
            const [mode, setMode] = useState('menu'); 
            const [activeQuestions, setActiveQuestions] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [showAnswerState, setShowAnswerState] = useState(false);

            useEffect(() => {
                const cats = [...new Set(allQuestions.map(q => q.category))];
                setCategories(["全部題目", "錯題本", ...cats]);
            }, [allQuestions]);

            const startQuiz = (cat) => {
                let filtered = [];
                if (cat === "錯題本") {
                    filtered = allQuestions.filter(q => userAnswers[q.id]?.isCorrect === false);
                    if (filtered.length === 0) {
                        alert("太棒了！您的錯題本目前是空的！");
                        return;
                    }
                } else if (cat === "全部題目") {
                    filtered = allQuestions;
                } else {
                    filtered = allQuestions.filter(q => q.category === cat);
                }
                
                setActiveQuestions([...filtered].sort(() => Math.random() - 0.5));
                setCurrentIndex(0);
                setMode('quiz');
                setShowAnswerState(false);
            };

            const handleOptionClick = (optionStr) => {
                const currentQ = activeQuestions[currentIndex];
                if (userAnswers[currentQ.id]) return; 

                const selectedLetter = optionStr.match(/^\(([A-E])\)/)[1];
                const isCorrect = selectedLetter === currentQ.correctLetter;

                setUserAnswers(prev => ({
                    ...prev,
                    [currentQ.id]: { selected: selectedLetter, isCorrect }
                }));
            };

            const handleShortAnswerReveal = () => {
                const currentQ = activeQuestions[currentIndex];
                if (userAnswers[currentQ.id]) return;
                
                setShowAnswerState(true);
                setUserAnswers(prev => ({
                    ...prev,
                    [currentQ.id]: { selected: "revealed", isCorrect: true } 
                }));
            };

            const nextQuestion = () => {
                if (currentIndex < activeQuestions.length - 1) {
                    setCurrentIndex(prev => prev + 1);
                    setShowAnswerState(false);
                } else {
                    setMode('result');
                }
            };

            const currentQ = activeQuestions[currentIndex];
            const qState = currentQ ? userAnswers[currentQ.id] : null;
            const isAnswered = !!qState;

                return (

                            </header>

                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
                                <h2 className="text-xl font-semibold mb-6 flex items-center gap-2">
                                    <ListIcon size={24} className="text-indigo-500"/> 請選擇練習範圍
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {categories.map((cat, idx) => {
                                        const count = cat === "全部題目" 
                                            ? allQuestions.length 
                                            : cat === "錯題本" 
                                            ? Object.values(userAnswers).filter(a => !a.isCorrect).length 
                                            : allQuestions.filter(q => q.category === cat).length;
                                        
                                        return (

                                                className={`flex justify-between items-center p-4 rounded-xl text-left transition-all ${

                                                    {count} 題
                                                </span>
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>
                    </div>
                );

                const score = Math.round((correctCount / activeQuestions.length) * 100);

                return (

                                <Award size={48} />
                            </div>
                            <h2 className="text-3xl font-bold mb-2">測驗完成！</h2>
                            <p className="text-slate-500 mb-8">您在本次挑戰中完成了 {activeQuestions.length} 道題目</p>
                            
                            <div className="text-6xl font-black text-indigo-600 mb-8">
                                {score} <span className="text-2xl text-slate-400 font-medium">分</span>
                            </div>

                            <div className="flex gap-4 justify-center">

                                    onClick={() => setMode('menu')}

                                >
                                    <BookOpen size={20} /> 回到目錄
                                </button>
                                <button 
                                    onClick={() => startQuiz('錯題本')}
                                    className="flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium transition-colors shadow-lg shadow-indigo-200"
                                >
                                    <RotateCcw size={20} /> 複習錯題
                                </button>
                            </div>
                        </div>
                    </div>
                );

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans">

                        <div className="flex items-center justify-between mb-8">

                            </button>
                            <div className="text-center">
                                <div className="text-sm font-bold text-indigo-500 mb-1">{currentQ?.category}</div>
                                <div className="text-xs text-slate-400 font-medium tracking-widest">QUESTION {currentIndex + 1} OF {activeQuestions.length}</div>

                            <div className="w-10"></div>

                        {/* Progress Bar */}

                        {/* Question Card */}

                                        return (

                                        );

                        {/* Feedback & Next Button */}
                        <div className="h-24"> 
                            {isAnswered && (
                                <div className="flex flex-col md:flex-row gap-4 items-center justify-between">
                                    <div className="flex-1 bg-indigo-50 text-indigo-800 p-4 rounded-2xl flex items-start gap-3 w-full">
                                        <AlertCircle className="shrink-0 mt-0.5" size={20} />
                                        <div>
                                            <span className="font-bold text-sm block mb-1">詳解 / 備註</span>
                                            <span className="text-sm leading-relaxed">{currentQ?.rawAnswer}</span>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={nextQuestion}
                                        className="w-full md:w-auto px-8 py-4 bg-slate-800 hover:bg-slate-900 text-white rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-slate-200 transition-all shrink-0"
                                    >
                                        {currentIndex < activeQuestions.length - 1 ? '下一題' : '完成測驗'} <ChevronRight size={20} />
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
